  <rect width="1000" height="400" fill="#FFFFFF"/>
  <text x="500" y="30" font-size="15" font-weight="bold" fill="#232F3E" text-anchor="middle">Fan-out - which way the role assumption goes</text>
  <text x="500" y="50" font-size="11.5" fill="#545B64" text-anchor="middle">Assumption runs outward from the pipeline. Nothing in a workload account can reach back.</text>
  <rect x="40" y="70" width="330" height="290" rx="8" fill="none" stroke="#232F3E" stroke-width="1.4" stroke-dasharray="6 3"/>
  <text x="52" y="89" font-size="11.5" font-weight="bold" fill="#232F3E">Pipeline account</text>
  <rect x="440" y="70" width="520" height="290" rx="8" fill="none" stroke="#232F3E" stroke-width="1.4" stroke-dasharray="6 3"/>
  <text x="452" y="89" font-size="11.5" font-weight="bold" fill="#232F3E">Workload account (one per route)</text>
  <rect x="65" y="130" width="190" height="80" rx="8" fill="#FFFFFF" stroke="#879196" stroke-width="1.3"/>
  <use href="#icon-lambda" transform="translate(77,150) scale(0.5)"/>
  <text x="127" y="166" font-size="12" font-weight="bold" fill="#232F3E">AWS Lambda</text>
  <text x="127" y="182" font-size="10.5" fill="#545B64">alarm pipeline</text>
  <rect x="65" y="250" width="280" height="80" rx="8" fill="#FFFFFF" stroke="#879196" stroke-width="1.3"/>
  <use href="#icon-iam" transform="translate(77,270) scale(0.5)"/>
  <text x="127" y="286" font-size="12" font-weight="bold" fill="#232F3E">Pipeline Lambda role</text>
  <text x="127" y="302" font-size="10.5" fill="#545B64">sts:AssumeRole, scoped by aws:ResourceOrgID</text>
  <rect x="470" y="130" width="300" height="90" rx="8" fill="#FFFFFF" stroke="#879196" stroke-width="1.3"/>
  <use href="#icon-iam" transform="translate(482,155) scale(0.5)"/>
  <text x="532" y="163" font-size="12" font-weight="bold" fill="#232F3E">PrtgDevOpsAgent-</text>
  <text x="532" y="179" font-size="12" font-weight="bold" fill="#232F3E">InvestigationRole</text>
  <text x="532" y="195" font-size="10.5" fill="#545B64">trusts the pipeline role + ExternalId</text>
  <rect x="470" y="260" width="300" height="80" rx="8" fill="#FFFFFF" stroke="#879196" stroke-width="1.3"/>
  <use href="#icon-devops" transform="translate(482,280) scale(0.5)"/>
