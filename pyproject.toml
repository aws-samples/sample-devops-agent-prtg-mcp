[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prtg-mcp-devops-agent"
version = "1.0.0"
description = "Reference solution: PRTG Network Monitor MCP server and alarm pipeline for AWS DevOps Agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT-0" }

# The Lambda functions intentionally have no third-party runtime dependencies:
# boto3 and urllib3 are both provided by the managed Python runtime. That keeps
# the deployment package to source only, with no layer, no vendored wheels, and
# nothing to rebuild when a transitive dependency issues a CVE.
dependencies = []

[project.optional-dependencies]
dev = [
  "aws-cdk-lib>=2.266.0",
  "constructs>=10.0.0,<11.0.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pyyaml>=6.0",
  "boto3>=1.34",
  "urllib3>=2.0",
  "ruff>=0.6",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
  "integration: requires a reachable PRTG server and AWS credentials (deselected by default)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "infrastructure", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "S", "RET", "SIM", "PL"]
ignore = [
  "E501",    # line length is handled by the formatter
  "PLR0913", # tool functions legitimately take many keyword arguments
  "PLR2004", # magic values are readable in tests and schema bounds
  # Lazy imports are deliberate throughout. The Lambda handlers defer `import boto3`
  # so unit tests need neither boto3 nor network access, and a couple of modules
  # defer an import to break a cycle. Both are commented at the call site.
  "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on internals, use `assert` by design, and pass fake ARNs and tokens
# to keyword arguments whose names ruff reads as credential-bearing.
"tests/**" = ["S101", "S105", "S106", "PLR2004", "A002"]
# Tool function parameter names are fixed by the published MCP schema, including
# ones that shadow builtins (`id`, `type`). Renaming them would break the contract.
"src/prtg_mcp/handler.py" = ["A002"]
"src/prtg_mcp/tools.py" = ["A002"]
# `secret_arn` and `ca_bundle_secret_arn` are ARNs, not secrets; ruff cannot tell.
"src/prtg_mcp/prtg_client.py" = ["S105", "S106"]
"infrastructure/config.py" = ["S105", "S106"]
